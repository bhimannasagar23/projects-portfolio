name: Update Portfolio README

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project list
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re

          readme = Path("README.md")
          projects_dir = Path("projects")

          start_marker = "<!-- PROJECTS:START -->"
          end_marker = "<!-- PROJECTS:END -->"

          projects = []

          if projects_dir.exists():

              for folder in sorted(projects_dir.iterdir()):

                  if not folder.is_dir():
                      continue

                  html_files = list(folder.glob("index.html"))

                  if not html_files:
                      html_files = list(folder.glob("*.html"))

                  if not html_files:
                      continue

                  html_file = html_files[0]

                  title = folder.name

                  title = title.replace("-", " ")
                  title = title.replace("_", " ")
                  title = title.replace("+", " ")

                  title = re.sub(r"\s+", " ", title).strip()
                  title = title.title()

                  relative_path = html_file.relative_to(Path("."))

                  url_path = "/".join(
                      quote(part)
                      for part in relative_path.parts
                  )

                  link = (
                      "https://bhimannasagar23.github.io/"
                      "projects-portfolio/"
                      + url_path
                  )

                  projects.append(
                      f"| **{title}** | [Live Demo →]({link}) |"
                  )

          if projects:

              project_table = "\n".join([
                  "| Project | Live Demo |",
                  "|---|---|",
                  *projects
              ])

          else:

              project_table = (
                  "| No projects found | — |"
              )

          new_section = (
              f"{start_marker}\n\n"
              f"{project_table}\n\n"
              f"{end_marker}"
          )

          if readme.exists():

              content = readme.read_text(
                  encoding="utf-8"
              )

              pattern = re.compile(
                  re.escape(start_marker)
                  + r".*?"
                  + re.escape(end_marker),
                  re.DOTALL
              )

              if pattern.search(content):

                  content = pattern.sub(
                      new_section,
                      content
                  )

              else:

                  content += (
                      "\n\n"
                      + new_section
                      + "\n"
                  )

          else:

              content = (
                  "# Web Development Projects\n\n"
                  + new_section
                  + "\n"
              )

          readme.write_text(
              content,
              encoding="utf-8"
          )
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || git commit -m "docs: update project list [skip ci]"

          git push